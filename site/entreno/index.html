<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entreno de Bitácora</title>
  <meta name="theme-color" content="#0b0c0a">
  <meta property="og:title" content="Te han pasado un entreno de Bitácora">
  <meta property="og:description" content="Míralo aquí mismo, sin instalar nada.">
  <meta property="og:image" content="https://kapparron.github.io/Bitacora/icon.png">
  <link rel="icon" href="../favicon.png">
  <!-- Los colores salen de data/theme.json; los escribe `npm run build:data`. -->
  <link rel="stylesheet" href="../estilo.css">
  <link rel="stylesheet" href="../paginas.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="../">
        <img src="../icon.png" alt="">
        <span>Bitácora</span>
      </a>
      <a class="get" href="../#descargar">Descargar la app</a>
    </div>
  </header>

  <main class="wrap">
    <h1 id="title">Entreno</h1>
    <p id="subtitle">Cargando...</p>

    <div id="session">
      <dl class="summary">
        <div><dt>Duración</dt><dd id="duration">-</dd></div>
        <div><dt>Volumen</dt><dd id="volume">-</dd></div>
        <div><dt>Series</dt><dd id="sets">-</dd></div>
      </dl>

      <p id="notes" hidden></p>

      <div id="exercises"></div>

      <div class="get-app">
        <p>Este entreno viaja entero dentro del enlace: no está guardado en ningún servidor.</p>
        <a class="button" href="../#descargar">Registra los tuyos</a>
      </div>
    </div>
  </main>

  <footer>
    Imágenes de los ejercicios: © Gym visual — <a href="https://gymvisual.com">gymvisual.com</a>
  </footer>

  <script type="module">
    import { render } from './entreno.js';

    render();
    // A link opened from another link only changes the fragment.
    addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
