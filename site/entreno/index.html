<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entreno de Bitácora</title>
  <meta name="theme-color" content="#0b0c0a">
  <meta property="og:title" content="Te han pasado un entreno de Bitácora">
  <meta property="og:description" content="Míralo aquí mismo, sin instalar nada.">
  <meta property="og:image" content="https://kapparron.github.io/Bitacora/icon.png">
  <link rel="icon" href="../favicon.png">
  <style>
    :root {
      --bg: #0b0c0a;
      --bg-raised: #15171a;
      --bg-line: #25282c;
      --bg-input: #212225;
      --text: #f4f6f0;
      --muted: #9aa097;
      --accent: #96d62f;
      --warm: #f5a524;
      --on-accent: #0b0c0a;
      --display: "Bahnschrift", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
      --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--body); line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    img { display: block; }
    .wrap { width: min(560px, 100% - 32px); margin-inline: auto; }
    .muted { color: var(--muted); }

    /* Header, the same bar as the front page so the two feel like one site. */
    header { border-bottom: 1px solid var(--bg-line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    .brand span {
      font-family: var(--display); font-weight: 800; font-style: italic;
      text-transform: uppercase; font-size: 1.35rem;
    }
    header a.get { color: var(--accent); text-decoration: none; font-weight: 700; font-size: .9rem; }

    /* Session */
    main { padding: 28px 0 48px; }
    h1 {
      font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase;
      font-size: clamp(2rem, 8vw, 3rem); line-height: .95; margin: 0 0 6px; overflow-wrap: anywhere;
    }
    #subtitle { margin: 0; color: var(--muted); }

    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr);
      margin: 20px 0 16px; padding: 14px 0;
      border: 1px solid var(--bg-line); border-radius: 12px;
    }
    .summary div { text-align: center; }
    .summary dt { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    .summary dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }

    #notes {
      margin: 0 0 16px; padding: 12px 14px; border-radius: 12px;
      background: var(--bg-raised); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere;
    }

    /* One exercise, drawn like the card in the app. */
    .card {
      background: var(--bg-raised); border: 1px solid var(--bg-line); border-radius: 14px;
      padding: 12px; margin-bottom: 10px;
    }
    .card.superset { border-left: 3px solid var(--accent); }
    .superset-label {
      margin: 0 0 6px; color: var(--accent); font-size: .72rem; font-weight: 700; letter-spacing: .08em;
    }
    .card-head { display: flex; align-items: center; gap: 12px; }
    .card-title { min-width: 0; }
    .card h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
    .card-title p { margin: 2px 0 0; font-size: .82rem; }
    .card-title .note { color: var(--muted); font-style: italic; }
    .thumb {
      flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 10px;
      background: #fff; overflow: hidden; cursor: pointer;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .sets { list-style: none; margin: 10px 0 0; padding: 0; }
    .set {
      display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
      padding: 6px 0; font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--bg-line);
    }
    .set .badge {
      text-align: center; font-weight: 700; font-size: .8rem;
      background: var(--bg-input); border-radius: 6px; padding: 2px 0;
    }
    .set.warmup .badge { color: var(--warm); }
    .set .measures { font-weight: 600; }
    .set .rpe { color: var(--muted); font-size: .78rem; }

    /* Footer */
    .get-app {
      margin-top: 28px; padding: 20px; border: 1px solid var(--bg-line); border-radius: 14px; text-align: center;
    }
    .get-app p { margin: 0 0 14px; color: var(--muted); }
    .button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 26px; background: var(--accent); color: var(--on-accent);
      font-family: var(--display); font-weight: 800; font-style: italic;
      text-transform: uppercase; letter-spacing: .04em; font-size: 1.05rem; text-decoration: none;
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    }
    footer { padding: 24px 0 40px; color: var(--muted); font-size: .78rem; text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="https://kapparron.github.io/Bitacora/">
        <img src="../icon.png" alt="">
        <span>Bitácora</span>
      </a>
      <a class="get" href="https://kapparron.github.io/Bitacora/#descargar">Descargar la app</a>
    </div>
  </header>

  <main class="wrap">
    <h1 id="title">Entreno</h1>
    <p id="subtitle">Cargando...</p>

    <div id="session">
      <dl class="summary">
        <div><dt>Duración</dt><dd id="duration">-</dd></div>
        <div><dt>Volumen</dt><dd id="volume">-</dd></div>
        <div><dt>Series</dt><dd id="sets">-</dd></div>
      </dl>

      <p id="notes" hidden></p>

      <div id="exercises"></div>

      <div class="get-app">
        <p>Este entreno viaja entero dentro del enlace: no está guardado en ningún servidor.</p>
        <a class="button" href="https://kapparron.github.io/Bitacora/#descargar">Registra los tuyos</a>
      </div>
    </div>
  </main>

  <footer>
    Imágenes de los ejercicios: © Gym visual — <a href="https://gymvisual.com">gymvisual.com</a>
  </footer>

  <script type="module">
    import { render } from './entreno.js';

    render();
    // A link opened from another link only changes the fragment.
    addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
