<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Rutina de Bitácora</title>
  <meta name="theme-color" content="#0b0c0a">
  <meta property="og:title" content="Te han pasado una rutina de Bitácora">
  <meta property="og:description" content="Mírala aquí e impórtala en la app.">
  <meta property="og:image" content="https://kapparron.github.io/Bitacora/icon.png">
  <link rel="icon" href="../favicon.png">
  <!-- Los colores salen de data/theme.json; los escribe `npm run build:data`. -->
  <link rel="stylesheet" href="../estilo.css">
  <link rel="stylesheet" href="../paginas.css">
  <style>
    /* Lo que una rutina tiene y un entreno no: objetivos en vez de series hechas. */
    .targets {
      display: flex; justify-content: space-between; gap: 12px;
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg-line);
      font-variant-numeric: tabular-nums;
    }
    .targets .target { font-weight: 600; }

    #import { margin: 0 0 20px; }
    .qr { display: block; width: 200px; height: 200px; margin: 0 auto; border-radius: 8px; }
    .download { display: block; margin-top: 14px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="../">
        <img src="../icon.png" alt="">
        <span>Bitácora</span>
      </a>
      <a class="get" href="../#descargar">Descargar la app</a>
    </div>
  </header>

  <main class="wrap">
    <h1 id="title">Rutina</h1>
    <p id="subtitle">Cargando...</p>

    <div id="routine">
      <p id="notes" hidden></p>

      <div id="import" class="get-app"></div>

      <div id="exercises"></div>
    </div>
  </main>

  <footer>
    Imágenes de los ejercicios: © Gym visual — <a href="https://gymvisual.com">gymvisual.com</a>
  </footer>

  <script type="module">
    import { render } from './rutina.js';

    render();
    // Un enlace abierto desde otro enlace solo cambia el fragmento.
    addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
