# Los flujos fijan cada action por su commit, no por la etiqueta, asi que no
# reciben parches solos. Esto abre una propuesta al mes con los commits nuevos.
#
# Solo las actions. Las dependencias de npm no: los paquetes de Expo tienen que
# subir juntos con la version del SDK (`npx expo install --fix`), y una propuesta
# por paquete los dejaria desparejados. Los avisos de seguridad de npm llegan por
# su lado, desde los ajustes del repositorio.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
