name: Publicar web

# La web tiene la portada de la app, con la descarga de la ultima version; la
# pagina puente de las rutinas compartidas, porque WhatsApp y compania no dejan
# pulsar un enlace bitacora:// pero si uno https que lleve a la app; y la que
# dibuja un entreno compartido para quien no tiene la app. Se publica al cambiar
# la carpeta site en master, o a mano.
on:
  push:
    branches: [master]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
