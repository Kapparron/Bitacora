name: Publicar web

# La web tiene la portada de la app, con la descarga de la ultima version; la
# pagina de una rutina compartida, que la dibuja y ofrece importarla, porque
# WhatsApp y compania no dejan pulsar un enlace bitacora:// pero si uno https
# que lleve a la app; y la que dibuja un entreno compartido para quien no tiene
# la app.
#
# Se publica al cambiar la carpeta site en master, o los datos de los que esa
# carpeta se genera, o a mano.
on:
  push:
    branches: [master]
    paths: ['site/**', 'data/**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # La web sirve ficheros que se generan desde data/. Publicar sin comprobarlo
  # dejaba subir un catalogo viejo sin que nadie se enterase hasta la siguiente
  # release, que era cuando corrian las comprobaciones.
  comprobar:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: comprobar
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Subir la web
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
