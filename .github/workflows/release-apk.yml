name: Publicar APK

# El nombre de cada ejecucion dice que version publica, para distinguirlas en la
# lista de Actions.
run-name: Publicar version ${{ inputs.version }}

# Se lanza a mano desde la pestaña Actions. La rama la elige ahi el propio
# desplegable de GitHub, asi que aqui solo se pregunta la version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        type: string
      prerelease:
        description: Preliminar version
        required: false
        default: false
        type: boolean

# Una publicacion a la vez: dos a la vez se pisarian al crear la etiqueta.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # El paso final crea la release y sube el APK con el token del propio flujo.
    permissions:
      contents: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 24: las comprobaciones son TypeScript, y hasta esa version el
      # ejecutor de pruebas no las recorre por si mismo.
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle se pasa varios minutos descargando las dependencias de los
      # modulos nativos, y esas solo cambian cuando cambian las de npm. Se
      # guardan las descargas, no los resultados de compilar: una entrada vieja
      # como mucho se ignora, nunca se usa en lugar de una nueva.
      - name: Recuperar las descargas de Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          # Sirve una caja anterior aunque no case del todo: Gradle descarga solo
          # lo que le falte, que es mas rapido que empezar de cero.
          restore-keys: gradle-${{ runner.os }}-

      # Sin clave propia el APK saldria firmado con la de depuracion, que es
      # publica: cualquiera podria firmar una "actualizacion" que Android
      # aceptase. Se comprueba lo primero, antes de gastar minutos compilando.
      - name: Preparar la clave de firma
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BITACORA_KEYSTORE_PASSWORD" ] || [ -z "$BITACORA_KEY_ALIAS" ] || [ -z "$BITACORA_KEY_PASSWORD" ]; then
            echo "::error::Faltan los secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Ver docs/DESARROLLO.md."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bitacora.keystore"
          echo "BITACORA_KEYSTORE_FILE=$RUNNER_TEMP/bitacora.keystore" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BITACORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BITACORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BITACORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Pasar las comprobaciones
        run: npm run check

      # La version pedida manda sobre la que se compila, para que lo instalado y
      # lo publicado digan lo mismo. El numero de ejecucion sirve de versionCode:
      # Android solo exige que crezca.
      - name: Fijar la version
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';

            const version = process.env.VERSION.replace(/^v/, '');
            const app = JSON.parse(readFileSync('app.json', 'utf8'));

            app.expo.version = version;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);

            writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('version ' + version + ', versionCode ' + app.expo.android.versionCode);
          "
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      # El proyecto no guarda la carpeta android: se genera en cada compilacion a
      # partir de app.json, que es la unica fuente de la configuracion nativa.
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      # Solo arm64-v8a: es la arquitectura de cualquier movil actual, y las otras
      # tres anadian mas de 90 MB de librerias nativas que nadie llegaba a usar.
      # La minificacion recorta ademas las clases Java a las que no se llama.
      - name: Compilar el APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true
        working-directory: android
        env:
          BITACORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BITACORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BITACORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Que el plugin de firma haya hecho su trabajo: un APK con la clave de
      # depuracion no se publica.
      - name: Comprobar la firma
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee firma.txt
          if grep -q "CN=Android Debug" firma.txt; then
            echo "::error::El APK esta firmado con la clave de depuracion."
            exit 1
          fi

      - name: Renombrar el APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "bitacora-$VERSION.apk"
        env:
          VERSION: ${{ inputs.version }}

      # La etiqueta se crea sobre el commit que se acaba de compilar, sea de la
      # rama que sea.
      - name: Publicar la release
        run: |
          gh release create "$VERSION" "bitacora-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Bitacora $VERSION" \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
