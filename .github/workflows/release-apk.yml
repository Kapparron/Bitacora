name: Publicar APK

# El nombre de cada ejecucion dice que version publica, para distinguirlas en la
# lista de Actions.
run-name: Publicar version ${{ inputs.version }}

# Se lanza a mano desde la pestaña Actions. La rama la elige ahi el propio
# desplegable de GitHub, asi que aqui solo se pregunta la version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        type: string
      prerelease:
        description: Preliminar version
        required: false
        default: false
        type: boolean

# Una publicacion a la vez: dos a la vez se pisarian al crear la etiqueta.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # El paso final crea la release y sube el APK con el token del propio flujo.
    permissions:
      contents: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # Node 24: las comprobaciones son TypeScript, y hasta esa version el
      # ejecutor de pruebas no las recorre por si mismo.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Pasar las comprobaciones
        run: npm run check

      # La version pedida manda sobre la que se compila, para que lo instalado y
      # lo publicado digan lo mismo. El numero de ejecucion sirve de versionCode:
      # Android solo exige que crezca.
      - name: Fijar la version
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';

            const version = process.env.VERSION.replace(/^v/, '');
            const app = JSON.parse(readFileSync('app.json', 'utf8'));

            app.expo.version = version;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);

            writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('version ' + version + ', versionCode ' + app.expo.android.versionCode);
          "
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}

      # El proyecto no guarda la carpeta android: se genera en cada compilacion a
      # partir de app.json, que es la unica fuente de la configuracion nativa.
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Renombrar el APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "bitacora-${{ inputs.version }}.apk"

      # La etiqueta se crea sobre el commit que se acaba de compilar, sea de la
      # rama que sea.
      - name: Publicar la release
        run: |
          gh release create "$VERSION" "bitacora-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Bitacora $VERSION" \
            --generate-notes \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
